<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Bunker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Inter+Tight:wght@800;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F0EDE0;
    --text: rgba(30,28,22,0.72);
    --text-bright: #1A1814;
    --text-dim: rgba(30,28,22,0.38);
    --forest: #2D5A27;
    --forest-dim: rgba(45,90,39,0.5);
    --rule: rgba(30,28,22,0.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse at 20% 15%, rgba(200,190,165,0.25) 0%, transparent 50%),
      radial-gradient(ellipse at 75% 80%, rgba(190,182,158,0.2) 0%, transparent 45%),
      radial-gradient(ellipse at 50% 50%, rgba(210,203,180,0.15) 0%, transparent 60%);
    color: var(--text);
    font-family: 'Newsreader', Georgia, serif;
    font-size: 19px;
    line-height: 1.9;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  a {
    color: var(--text-bright);
    text-decoration: none;
    border-bottom: 1px solid var(--rule);
    transition: border-color 0.15s, color 0.15s;
  }
  a:hover {
    color: var(--text-bright);
    border-color: var(--text-bright);
  }

  .navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
    padding: 24px 32px;
    border-bottom: 2px solid var(--text-bright);
  }
  .navbar-brand {
    font-family: 'Inter Tight', Helvetica, sans-serif;
    font-weight: 900;
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-bright);
    border-bottom: none;
  }
  .navbar-links {
    display: flex;
    gap: 24px;
    list-style: none;
  }
  .navbar-links a {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--forest);
    border-bottom: none;
  }
  .navbar-links a:hover { color: var(--text-bright); }

  .four-oh-four {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    max-width: 640px;
    margin: 0 auto;
    padding: 0 32px;
    text-align: center;
  }
  .four-oh-four h1 {
    font-family: 'Inter Tight', Helvetica, sans-serif;
    font-weight: 900;
    font-size: clamp(72px, 15vw, 180px);
    line-height: 0.9;
    letter-spacing: -0.05em;
    color: var(--text-bright);
  }
  .four-oh-four p {
    margin-top: 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .four-oh-four .back {
    margin-top: 40px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--forest);
    border-bottom: 1px solid var(--forest-dim);
  }
  .four-oh-four .back:hover { color: var(--text-bright); border-color: var(--text-bright); }
</style>
</head>
<body>

<nav class="navbar">
  <a class="navbar-brand" href="/">Bunker</a>
  <ul class="navbar-links">
    <li><a href="/ai-models">AI Models</a></li>
  </ul>
</nav>

<main class="four-oh-four">
  <h1>404</h1>
  <p>This page doesn't exist yet.</p>
  <a class="back" href="/">Back to Bunker</a>
</main>

</body>
</html>
